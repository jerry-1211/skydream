{# Sort Order Stepper Component
   Usage: {% with sort_value=item.sort_order %}{% include 'admin/components/sort_order.html' %}{% endwith %}
#}
<div class="form-group">
    <label><i class="fas fa-sort-amount-up-alt" style="color:#42A5F5;"></i> 표시 순서</label>
    <div class="sort-order-control">
        <button type="button" class="sort-btn sort-btn-minus" onclick="adjustOrder(-1)">
            <i class="fas fa-minus"></i>
        </button>
        <div class="sort-order-display">
            <input type="number" id="sort_order" name="sort_order" value="{{ sort_value|default(0) }}" min="0" max="99">
            <span class="sort-order-label">번째</span>
        </div>
        <button type="button" class="sort-btn sort-btn-plus" onclick="adjustOrder(1)">
            <i class="fas fa-plus"></i>
        </button>
    </div>
    <div class="form-hint">숫자가 작을수록 앞에 표시됩니다.</div>
</div>
<script>
function adjustOrder(delta) {
    var input = document.getElementById('sort_order');
    var val = parseInt(input.value) || 0;
    val = Math.max(0, Math.min(99, val + delta));
    input.value = val;
}
</script>
