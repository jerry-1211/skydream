{% extends "admin/base.html" %}
{% block title %}{{ '갤러리 수정' if gallery_item else '갤러리 추가' }}{% endblock %}
{% block page_title %}{{ '갤러리 수정' if gallery_item else '갤러리 추가' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('admin.gallery_edit', id=gallery_item.id) if gallery_item else url_for('admin.gallery_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ gallery_item.title if gallery_item else '' }}" required>
            </div>

            <div class="form-group">
                <label for="image_id">이미지</label>
                <select id="image_id" name="image_id" class="form-control">
                    <option value="">이미지 없음</option>
                    {% for media in media_list %}
                    <option value="{{ media.id }}" {{ 'selected' if gallery_item and gallery_item.image_id == media.id }}>{{ media.original_filename }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="sort_order">정렬 순서</label>
                <input type="number" id="sort_order" name="sort_order" class="form-control" value="{{ gallery_item.sort_order if gallery_item else 0 }}" style="max-width:120px;">
                <div class="form-hint">숫자가 작을수록 앞에 표시됩니다.</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ '수정' if gallery_item else '등록' }}
                </button>
                <a href="{{ url_for('admin.gallery_list') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
