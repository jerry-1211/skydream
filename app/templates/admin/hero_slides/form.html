{% extends "admin/base.html" %}
{% block title %}{{ '슬라이드 수정' if slide else '슬라이드 추가' }}{% endblock %}
{% block page_title %}{{ '슬라이드 수정' if slide else '슬라이드 추가' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('admin.hero_slides_edit', id=slide.id) if slide else url_for('admin.hero_slides_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="heading">제목</label>
                <input type="text" id="heading" name="heading" class="form-control" value="{{ slide.heading if slide else '' }}" required>
            </div>

            <div class="form-group">
                <label for="description">설명</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ slide.description if slide else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="button_text">버튼 텍스트</label>
                <input type="text" id="button_text" name="button_text" class="form-control" value="{{ slide.button_text if slide else '' }}">
                <div class="form-hint">비워두면 버튼이 표시되지 않습니다.</div>
            </div>

            <div class="form-group">
                <label for="button_link">버튼 링크</label>
                <input type="text" id="button_link" name="button_link" class="form-control" value="{{ slide.button_link if slide else '' }}" placeholder="/about">
            </div>

            <div class="form-group">
                <label for="image_id">배경 이미지</label>
                <select id="image_id" name="image_id" class="form-control">
                    <option value="">이미지 없음</option>
                    {% for media in media_list %}
                    <option value="{{ media.id }}" {{ 'selected' if slide and slide.image_id == media.id }}>{{ media.original_filename }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="sort_order">정렬 순서</label>
                <input type="number" id="sort_order" name="sort_order" class="form-control" value="{{ slide.sort_order if slide else 0 }}" style="max-width:120px;">
            </div>

            <div class="form-check">
                <input type="checkbox" id="is_active" name="is_active" {{ 'checked' if (slide and slide.is_active) or not slide }}>
                <label for="is_active">활성화</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ '수정' if slide else '등록' }}
                </button>
                <a href="{{ url_for('admin.hero_slides_list') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
