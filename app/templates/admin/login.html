<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 하늘 꿈나무 어린이집</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            margin: 1rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo-mark {
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .login-logo-mark svg {
            filter: drop-shadow(0 4px 8px rgba(79, 195, 247, 0.3));
        }
        .login-logo-name {
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
            -webkit-text-stroke: 0.3px currentColor;
        }
        .login-logo-name .c1 { color: #F4A460; }
        .login-logo-name .c2 { color: #E88D8D; }
        .login-logo-name .c3 { color: #6EC6C6; }
        .login-logo-name .c4 { color: #8FBC8F; }
        .login-logo-name .c5 { color: #7AB8D9; }
        .login-header h1 {
            font-family: 'Dongle', sans-serif;
            font-size: 2rem;
            color: #4FC3F7;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4FC3F7;
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: #4FC3F7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-login:hover {
            background: #0288D1;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.3);
        }
        .flash-message {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .flash-error {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .flash-success {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link a:hover {
            color: #4FC3F7;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo-mark">
                <svg viewBox="0 0 48 48" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="18" cy="22" r="9" fill="#64B5F6"/>
                    <circle cx="28" cy="19" r="10" fill="#42A5F5"/>
                    <circle cx="22" cy="16" r="8" fill="#90CAF9"/>
                    <circle cx="32" cy="24" r="7" fill="#64B5F6"/>
                    <circle cx="12" cy="24" r="6" fill="#90CAF9"/>
                    <rect x="22" y="28" width="3" height="10" rx="1.5" fill="#66BB6A"/>
                    <ellipse cx="19.5" cy="29.5" rx="4.5" ry="3.5" fill="#81C784"/>
                    <ellipse cx="27.5" cy="30.5" rx="4" ry="3" fill="#66BB6A"/>
                    <circle cx="38" cy="10" r="2.5" fill="#FFD54F"/>
                    <path d="M38 5.5v2M38 13v2M33.5 10H35.5M40.5 10H42.5M34.5 6.5l1.4 1.4M40.1 12.1l1.4 1.4M40.1 6.5l-1.4 1.4M34.5 12.1l-1.4 1.4" stroke="#FFC107" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="login-logo-name">
                <span class="c1">하</span><span class="c2">늘</span><span class="c3">꿈</span><span class="c4">나</span><span class="c5">무</span>
            </div>
            <h1>관리자 로그인</h1>
            <p>하늘 꿈나무 어린이집 관리 시스템</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 아이디
                </label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="관리자 아이디를 입력하세요" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> 비밀번호
                </label>
                <input type="password" id="password" name="password" required
                       placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> 로그인
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('public.index') }}">
                <i class="fas fa-arrow-left"></i> 홈페이지로 돌아가기
            </a>
        </div>
    </div>
</body>
</html>
