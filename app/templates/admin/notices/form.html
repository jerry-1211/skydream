{% extends "admin/base.html" %}
{% block title %}{{ '공지사항 수정' if notice else '공지사항 작성' }}{% endblock %}
{% block page_title %}{{ '공지사항 수정' if notice else '공지사항 작성' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('admin.notices_edit', id=notice.id) if notice else url_for('admin.notices_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ notice.title if notice else '' }}" required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" name="content" class="form-control" rows="10" required>{{ notice.content if notice else '' }}</textarea>
            </div>

            <div class="form-check">
                <input type="checkbox" id="is_pinned" name="is_pinned" {{ 'checked' if notice and notice.is_pinned }}>
                <label for="is_pinned">상단 고정</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ '수정' if notice else '등록' }}
                </button>
                <a href="{{ url_for('admin.notices_list') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
