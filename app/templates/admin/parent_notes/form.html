{% extends "admin/base.html" %}
{% block title %}{{ '알림 수정' if note else '알림 작성' }}{% endblock %}
{% block page_title %}{{ '알림 수정' if note else '알림 작성' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('admin.parent_notes_edit', id=note.id) if note else url_for('admin.parent_notes_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ note.title if note else '' }}" required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" name="content" class="summernote" required>{{ note.content if note else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="target_class">대상 반</label>
                <select id="target_class" name="target_class" class="form-control" style="max-width:200px;">
                    {% for key, label in target_classes.items() %}
                    <option value="{{ key }}" {{ 'selected' if note and note.target_class == key }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ '수정' if note else '등록' }}
                </button>
                <a href="{{ url_for('admin.parent_notes_list') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
