{% extends "admin/base.html" %}
{% block title %}{{ '프로그램 수정' if program else '프로그램 추가' }}{% endblock %}
{% block page_title %}{{ '프로그램 수정' if program else '프로그램 추가' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('admin.programs_edit', id=program.id) if program else url_for('admin.programs_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="category">카테고리</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">선택하세요</option>
                    {% for key, label in categories.items() %}
                    <option value="{{ key }}" {{ 'selected' if program and program.category == key }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ program.title if program else '' }}" required>
            </div>

            <div class="form-group">
                <label for="description">설명</label>
                <textarea id="description" name="description" class="form-control" rows="5">{{ program.description if program else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="image_id">이미지</label>
                <select id="image_id" name="image_id" class="form-control">
                    <option value="">이미지 없음</option>
                    {% for media in media_list %}
                    <option value="{{ media.id }}" {{ 'selected' if program and program.image_id == media.id }}>{{ media.original_filename }}</option>
                    {% endfor %}
                </select>
                <div class="form-hint">미디어 라이브러리에서 이미지를 선택하세요.</div>
            </div>

            <div class="form-group">
                <label for="sort_order">정렬 순서</label>
                <input type="number" id="sort_order" name="sort_order" class="form-control" value="{{ program.sort_order if program else 0 }}" style="max-width:120px;">
                <div class="form-hint">숫자가 작을수록 앞에 표시됩니다.</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ '수정' if program else '등록' }}
                </button>
                <a href="{{ url_for('admin.programs_list') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
