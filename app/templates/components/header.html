<!-- Site Header -->
<header class="site-header" role="banner">
    <nav aria-label="메인 네비게이션">
        <div class="logo">
            <a href="{{ url_for('public.index') }}" aria-label="하늘 꿈나무 어린이집 홈">
                <span class="logo-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="42" height="42" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="18" cy="22" r="9" fill="#64B5F6"/>
                        <circle cx="28" cy="19" r="10" fill="#42A5F5"/>
                        <circle cx="22" cy="16" r="8" fill="#90CAF9"/>
                        <circle cx="32" cy="24" r="7" fill="#64B5F6"/>
                        <circle cx="12" cy="24" r="6" fill="#90CAF9"/>
                        <rect x="22" y="28" width="3" height="10" rx="1.5" fill="#66BB6A"/>
                        <ellipse cx="19.5" cy="29.5" rx="4.5" ry="3.5" fill="#81C784"/>
                        <ellipse cx="27.5" cy="30.5" rx="4" ry="3" fill="#66BB6A"/>
                        <circle cx="38" cy="10" r="2.5" fill="#FFD54F"/>
                        <path d="M38 5.5v2M38 13v2M33.5 10H35.5M40.5 10H42.5M34.5 6.5l1.4 1.4M40.1 12.1l1.4 1.4M40.1 6.5l-1.4 1.4M34.5 12.1l-1.4 1.4" stroke="#FFC107" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="logo-text-group">
                    <span class="logo-main">
                        <span class="lc lc1">하</span><span class="lc lc2">늘</span><span class="lc lc3">꿈</span><span class="lc lc4">나</span><span class="lc lc5">무</span>
                    </span>
                    <span class="logo-sub">공공형 어린이집</span>
                </span>
            </a>
        </div>
        <ul class="nav-links" id="navLinks" role="menubar">
            <li class="nav-close-wrap" role="none">
                <button class="nav-close-btn" id="navCloseBtn" aria-label="메뉴 닫기">&times;</button>
            </li>
            <li role="none">
                <a href="{{ url_for('public.about') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint == 'public.about' }}">어린이집 소개</a>
            </li>
            <li role="none">
                <a href="{{ url_for('public.teachers') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint == 'public.teachers' }}">교사소개</a>
            </li>
            <li role="none" class="has-dropdown">
                <a href="{{ url_for('public.programs') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint in ['public.programs', 'public.gallery'] }}">교육과정</a>
                <ul class="dropdown-menu" role="menu">
                    <li role="none"><a href="{{ url_for('public.programs') }}" role="menuitem">프로그램</a></li>
                    <li role="none"><a href="{{ url_for('public.gallery') }}" role="menuitem">활동 앨범</a></li>
                </ul>
            </li>
            <li role="none" class="has-dropdown">
                <a href="{{ url_for('public.notices') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint in ['public.notices', 'public.notice_detail', 'public.parent_notes', 'public.parent_note_detail'] }}">알림마당</a>
                <ul class="dropdown-menu" role="menu">
                    <li role="none"><a href="{{ url_for('public.notices') }}" role="menuitem">공지사항</a></li>
                    <li role="none"><a href="{{ url_for('public.parent_notes') }}" role="menuitem">가정통신문</a></li>
                </ul>
            </li>
            <li role="none"><a href="{{ url_for('public.events') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint == 'public.events' }}">행사일정</a></li>
            <li role="none"><a href="{{ url_for('public.contact') }}" role="menuitem"
                   class="{{ 'active' if request.endpoint == 'public.contact' }}">오시는 길</a></li>
        </ul>
        <button class="burger" id="burger" aria-label="메뉴 열기" aria-expanded="false" aria-controls="navLinks">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </button>
    </nav>
</header>
