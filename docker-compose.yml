version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DATABASE_URL=postgresql://skydream:${DB_PASSWORD:-skydream123}@db:5432/skydream
      - UPLOAD_FOLDER=app/static/uploads
      - MAX_CONTENT_LENGTH=10485760
    volumes:
      - uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: docker/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app/static:/app/static:ro
      - uploads:/app/static/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=skydream
      - POSTGRES_USER=skydream
      - POSTGRES_PASSWORD=${DB_PASSWORD:-skydream123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skydream"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  certbot_www:
  certbot_conf:
